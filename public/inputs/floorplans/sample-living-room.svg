<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="sans-serif">
  <!-- 範例平面施工圖：整張圖寬 6.4 m（100 px = 1 m），房間內緣 5.4 m × 4.2 m，置中 -->
  <rect width="640" height="520" fill="#fbfaf6"/>
  <g stroke="#e3e0d6" stroke-width="1">
    <path d="M0 10H640M0 110H640M0 210H640M0 310H640M0 410H640M0 510H640" />
    <path d="M20 0V520M120 0V520M220 0V520M320 0V520M420 0V520M520 0V520M620 0V520" />
  </g>
  <!-- 牆體 -->
  <path fill-rule="evenodd" fill="#2b2b2b" d="M38 38H602V482H38Z M50 50V470H590V50Z"/>
  <!-- 北牆窗 -->
  <rect x="384" y="38" width="200" height="12" fill="#fbfaf6"/>
  <path d="M384 44H584M384 38V50M584 38V50" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- 西牆窗 -->
  <rect x="38" y="196" width="12" height="140" fill="#fbfaf6"/>
  <path d="M44 196V336M38 196H50M38 336H50" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- 南牆門與開門弧 -->
  <rect x="421" y="470" width="90" height="12" fill="#fbfaf6"/>
  <path d="M421 470V380A90 90 0 0 1 511 470" fill="none" stroke="#2b2b2b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M421 470V380" stroke="#2b2b2b" stroke-width="3"/>
  <!-- 家具示意（對應預設格局的電視櫃 / 沙發 / 餐桌） -->
  <g fill="none" stroke="#7a7a7a" stroke-width="1.5">
    <rect x="140" y="53" width="180" height="40" />
    <text x="230" y="77" font-size="11" fill="#7a7a7a" stroke="none" text-anchor="middle">TV 櫃</text>
    <rect x="120" y="362" width="220" height="95" />
    <text x="230" y="414" font-size="11" fill="#7a7a7a" stroke="none" text-anchor="middle">SOFA</text>
    <rect x="440" y="150" width="140" height="80" />
    <text x="510" y="194" font-size="11" fill="#7a7a7a" stroke="none" text-anchor="middle">餐桌</text>
  </g>
  <!-- 尺寸標註 -->
  <g stroke="#d9534f" stroke-width="1.2" fill="#d9534f" font-size="13">
    <path d="M50 26H590M50 20V32M590 20V32"/>
    <text x="320" y="20" stroke="none" text-anchor="middle">5400</text>
    <path d="M614 50V470M608 50H620M608 470H620"/>
    <text x="0" y="0" stroke="none" text-anchor="middle" transform="translate(630 260) rotate(90)">4200</text>
  </g>
  <text x="320" y="262" font-size="22" fill="#9a9a9a" text-anchor="middle" font-weight="600">客廳 LIVING</text>
  <text x="320" y="284" font-size="12" fill="#b0b0b0" text-anchor="middle">5.4 m × 4.2 m　|　圖寬 6.4 m（1 格 = 1 m）</text>
  <!-- 比例尺 -->
  <g stroke="#2b2b2b" stroke-width="2"><path d="M20 505H120M20 499V511M120 499V511"/></g>
  <text x="70" y="496" font-size="11" text-anchor="middle" fill="#2b2b2b">1 m</text>
</svg>
