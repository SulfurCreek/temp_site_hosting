<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程報價單試算系統</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .price-update {
            animation: pulse-green 0.5s ease-out;
        }
        @keyframes pulse-green {
            0% { transform: scale(1); color: #15803d; }
            50% { transform: scale(1.05); color: #16a34a; }
            100% { transform: scale(1); color: inherit; }
        }
        /* Style for the modal */
        #modal-overlay {
            display: none;
            backdrop-filter: blur(2px);
        }
        #modal-overlay.active {
            display: flex;
        }
        #modal-ai-overlay {
            display: none;
            backdrop-filter: blur(4px);
        }
        #modal-ai-overlay.active {
            display: flex;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col relative">

    <header class="bg-white shadow-sm sticky top-0 z-10">

            <div class="mt-1 sm:mt-2 text-xs sm:text-sm text-gray-500 flex flex-wrap justify-center gap-x-4 gap-y-1">
                <span>客戶: 貴賓</span>
                <span>地點: 指定建案</span>
                <span>日期: 115年07月31日</span>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto px-2 py-4 sm:px-6 lg:px-8 pb-32 sm:pb-32">
        
        <div class="bg-blue-50 border-l-4 border-blue-500 p-3 sm:p-4 mb-4 sm:mb-6 rounded-r-md">
            <p class="text-xs sm:text-sm text-blue-700">
                提示：您可以勾選或取消勾選下方的工程項目，系統會自動重新計算總價。
            </p>
        </div>

        <div id="quotation-container" class="space-y-4 sm:space-y-6">
            <!-- Sections will be dynamically injected here by JS -->
        </div>

    </main>

    <div class="fixed bottom-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20">
        <div class="max-w-4xl mx-auto px-4 py-2 sm:py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-3">
            <div class="w-full flex justify-between sm:justify-start items-center sm:w-auto">
                <div class="text-sm sm:text-base text-gray-600 font-medium whitespace-nowrap">
                    已選擇 <span id="selected-count" class="text-blue-600 font-bold">0</span> 項
                </div>
                <button id="btn-show-canceled" disabled class="ml-4 text-xs sm:text-sm bg-gray-100 text-gray-400 px-3 py-1.5 rounded border border-gray-200 transition-colors cursor-not-allowed whitespace-nowrap">
                    複製取消項目
                </button>
            </div>
            
            <div class="flex items-center gap-x-2 sm:gap-x-4 w-full sm:w-auto justify-end mt-1 sm:mt-0">
                <div class="text-sm sm:text-lg text-gray-700 font-semibold flex items-baseline">
                    未稅: <span class="text-gray-500 text-xs sm:text-base font-normal mx-1">NT$</span><span id="total-price" class="text-lg sm:text-2xl text-gray-900 transition-all duration-300">0</span>
                </div>
                <div class="text-[10px] sm:text-sm text-gray-500">
                    (含稅: $<span id="tax-total-price">0</span>)
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Canceled Items -->
                    未稅: <span class="text-gray-500 text-xs sm:text-base font-normal mx-1">NT$</span><span id="total-price" class="text-xl sm:text-2xl text-gray-900 transition-all duration-300">0</span>
                </div>
                <div class="text-xs sm:text-sm text-gray-500">
                    (含稅: $<span id="tax-total-price">0</span>)
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Canceled Items (保持不變) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md flex flex-col max-h-[80vh]">
            <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-lg">
                <h3 class="text-lg font-bold text-gray-800">已取消的項目</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-grow" id="canceled-items-list">
                <!-- Canceled items will be listed here -->
            </div>
            <div class="px-4 py-3 border-t border-gray-200 bg-gray-50 rounded-b-lg flex justify-end">
                <button id="btn-copy-canceled" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow-sm text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
                    複製內容
                </button>
            </div>
        </div>
    </div>

                    { name: "冷氣帽子(依現場決定是否)", unit: "式", qty: 3, price: 2500, amount: 7500, note: "台灣麗士", checked: true },
                    { name: "浴室滑門白身", unit: "樘", qty: 1, price: 18000, amount: 18000, note: "白身板", checked: true },

            },
            {

                    { name: "窗簾盒+冷氣盒,軌道盒油漆批土", unit: "尺", qty: 69.4, price: 600, amount: 41640, note: "得利乳膠漆", checked: true },
                    { name: "舊牆油漆沿用刷乾淨(不分色)不批不磨", unit: "式", qty: 1, price: 35000, amount: 35000, note: "不見光不施作)得利乳膠漆", checked: true },
                    { name: "隔間油漆批土", unit: "坪", qty: 10.5, price: 1900, amount: 19950, note: "得利乳膠漆", checked: true },

                    { name: "衣櫃鋁框系統門", unit: "樘", qty: 2, price: 24500, amount: 49000, note: "鋁框白", checked: true }
                ]
            },
            {

                items: [
                    { name: "玄關 高收納櫃鞋櫃.", unit: "尺", qty: 3.2, price: 8600, amount: 27520, note: "EGGER", checked: true },
                    { name: "帶孔立柱 H2100MM", unit: "支", qty: 4, price: 1400, amount: 5600, note: "多退少補", checked: true },
                    { name: "橫樑", unit: "支", qty: 4, price: 1200, amount: 4800, note: "多退少補", checked: true },
                    { name: "網片", unit: "片", qty: 4, price: 1200, amount: 4800, note: "多退少補", checked: true },
                    { name: "小支臂(中.大)", unit: "個", qty: 12, price: 460, amount: 5520, note: "多退少補", checked: true },

                    { name: "衣桿掛勾", unit: "個", qty: 6, price: 200, amount: 1200, note: "多退少補", checked: true },
                    { name: "網籃(大)", unit: "個", qty: 3, price: 4500, amount: 13500, note: "多退少補", checked: true },

                    { name: "床頭板", unit: "尺", qty: 10.8, price: 2200, amount: 23760, note: "EGGER", checked: true },
                    { name: "床側板", unit: "尺", qty: 7, price: 1800, amount: 12600, note: "EGGER", checked: true }
                ]
            }
        ];

        // Format number as currency
        const formatCurrency = (num) => {
            return new Intl.NumberFormat('zh-TW').format(num);
        };

        // Render the quotation structure
        const renderQuotation = () => {
            const container = document.getElementById('quotation-container');
            container.innerHTML = '';

            quotationData.forEach((section, sIndex) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden';
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'bg-gray-50 px-3 sm:px-4 py-2 sm:py-3 border-b border-gray-200 flex justify-between items-center';
                headerDiv.innerHTML = `
                    <h2 class="text-base sm:text-lg font-bold text-gray-800">${section.category}</h2>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <span class="text-xs sm:text-sm text-gray-500 group-hover:text-gray-700 transition-colors">全選</span>
                        <input type="checkbox" class="section-checkbox form-checkbox h-4 w-4 sm:h-5 sm:w-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300 transition duration-150 ease-in-out cursor-pointer" data-sindex="${sIndex}" checked>
                    </label>
                `;
                sectionDiv.appendChild(headerDiv);

                const ul = document.createElement('ul');
                ul.className = 'divide-y divide-gray-100';

                section.items.forEach((item, iIndex) => {
                    const li = document.createElement('li');
                    li.className = `p-2 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between transition-colors hover:bg-gray-50 gap-0 sm:gap-4 ${item.checked ? '' : 'opacity-60 bg-gray-50'}`;
                    
                    const isZeroAmount = item.amount === 0;
                    const amountText = isZeroAmount ? '待估' : formatCurrency(item.amount);
                    const amountDisplayClass = isZeroAmount ? 'text-gray-400' : 'text-gray-900';

                    li.innerHTML = `
                        <div class="flex items-start flex-grow">
                            <div class="flex-shrink-0 h-4 sm:h-5 mt-0.5 sm:mt-1 mr-2 sm:mr-3">
                                <input type="checkbox" class="item-checkbox form-checkbox h-4 w-4 sm:h-5 sm:w-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300 transition duration-150 ease-in-out cursor-pointer" data-sindex="${sIndex}" data-iindex="${iIndex}" ${item.checked ? 'checked' : ''}>
                            </div>
                            <div class="flex-grow">
                                <h3 class="text-sm sm:text-base font-medium text-gray-900 leading-tight">${item.name}</h3>
                                <div class="mt-0.5 sm:mt-1 flex flex-wrap gap-x-2 gap-y-0 text-xs sm:text-sm text-gray-500 items-center">
                                    <span>${item.qty} ${item.unit}</span>
                                    ${item.price > 0 ? `<span>@ $${formatCurrency(item.price)}</span>` : ''}
                                    ${item.note ? `<span class="text-orange-600 text-[10px] sm:text-xs flex items-center bg-orange-50 px-1 rounded h-fit">${item.note}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex-shrink-0 sm:ml-4 text-right mt-1 sm:mt-0 self-end sm:self-auto">
                            <div class="text-base sm:text-lg font-semibold ${amountDisplayClass} leading-none">
                                ${isZeroAmount ? '' : '<span class="text-xs sm:text-sm font-normal text-gray-500 mr-1">$</span>'}${amountText}
                            </div>
                        </div>
                    `;
                    ul.appendChild(li);
                });

                sectionDiv.appendChild(ul);
                container.appendChild(sectionDiv);
            });

            attachEventListeners();
            updateTotal();
        };

        const attachEventListeners = () => {
            document.querySelectorAll('.item-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const sIndex = parseInt(e.target.dataset.sindex);
                    const iIndex = parseInt(e.target.dataset.iindex);
                    quotationData[sIndex].items[iIndex].checked = e.target.checked;
                    
                    const li = e.target.closest('li');
                    if (e.target.checked) {
                        li.classList.remove('opacity-60', 'bg-gray-50');
                    } else {
                        li.classList.add('opacity-60', 'bg-gray-50');
                    }

                    updateSectionCheckbox(sIndex);
                    updateTotal();
                });
            });

            document.querySelectorAll('.section-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const sIndex = parseInt(e.target.dataset.sindex);
                    const isChecked = e.target.checked;
                    
                    quotationData[sIndex].items.forEach(item => item.checked = isChecked);
                    renderQuotation(); 
                });
            });
        };

        const updateSectionCheckbox = (sIndex) => {
            const section = quotationData[sIndex];
            const allChecked = section.items.every(item => item.checked);
            const sectionCb = document.querySelector(`.section-checkbox[data-sindex="${sIndex}"]`);
            if (sectionCb) {
                sectionCb.checked = allChecked;
            }
        };

        const updateTotal = () => {
            let total = 0;
            let count = 0;
            let hasCanceledItem = false;

            quotationData.forEach(section => {
                section.items.forEach(item => {
                    if (item.checked) {
                        total += item.amount;
                        if(item.amount > 0 || item.name === "走道保護工程") count++; 
                    } else {
                        hasCanceledItem = true;
                    }
                });
            });

            // 控制「複製取消項目」按鈕的狀態
            if (hasCanceledItem) {
                btnShowCanceled.removeAttribute('disabled');
                btnShowCanceled.classList.remove('text-gray-400', 'border-gray-200', 'cursor-not-allowed');
                btnShowCanceled.classList.add('hover:bg-gray-200', 'text-gray-700', 'border-gray-300', 'cursor-pointer');
            } else {
                btnShowCanceled.setAttribute('disabled', 'true');
                btnShowCanceled.classList.add('text-gray-400', 'border-gray-200', 'cursor-not-allowed');
                btnShowCanceled.classList.remove('hover:bg-gray-200', 'text-gray-700', 'border-gray-300', 'cursor-pointer');
            }

            const taxTotal = Math.round(total * 1.05);

            document.getElementById('selected-count').textContent = count;
            
            const totalEl = document.getElementById('total-price');
            totalEl.classList.remove('price-update');
            void totalEl.offsetWidth; 
            totalEl.classList.add('price-update');
            
            totalEl.textContent = formatCurrency(total);
            document.getElementById('tax-total-price').textContent = formatCurrency(taxTotal);
        };

        // Modal logic
        const modal = document.getElementById('modal-overlay');
        const btnShowCanceled = document.getElementById('btn-show-canceled');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCopyCanceled = document.getElementById('btn-copy-canceled');
        const canceledItemsList = document.getElementById('canceled-items-list');

        let textToCopy = '';

        btnShowCanceled.addEventListener('click', () => {
            let canceledHtml = '';
            let totalCanceledAmount = 0;
            textToCopy = '【取消勾選項目清單】\n\n';

            quotationData.forEach(section => {
                let sectionHasCanceled = false;
                let sectionHtml = `<h4 class="font-semibold text-gray-700 mt-2 mb-1">${section.category}</h4><ul class="space-y-1 mb-3">`;
                
                section.items.forEach(item => {
                    if (!item.checked) {
                        if (!sectionHasCanceled) {
                            textToCopy += `[${section.category}]\n`;
                            sectionHasCanceled = true;
                        }
                        const amountStr = item.amount === 0 ? '待估' : `$${formatCurrency(item.amount)}`;
                        sectionHtml += `<li class="flex justify-between text-sm text-gray-600 border-b border-gray-100 pb-1"><span>- ${item.name}</span> <span>${amountStr}</span></li>`;
                        textToCopy += `- ${item.name} : ${amountStr}\n`;
                        totalCanceledAmount += item.amount;
                    }
                });
                
                sectionHtml += `</ul>`;
                if (sectionHasCanceled) {
                    canceledHtml += sectionHtml;
                    textToCopy += '\n';
                }
            });

            if (canceledHtml === '') {
                canceledHtml = '<p class="text-gray-500 text-center py-4">目前沒有取消勾選的項目</p>';
                textToCopy = '目前沒有取消勾選的項目';
            } else {
                canceledHtml += `<div class="mt-4 pt-3 border-t border-gray-300 font-bold text-right text-gray-800">取消總金額: $${formatCurrency(totalCanceledAmount)}</div>`;
                textToCopy += `-------------------\n取消總金額: $${formatCurrency(totalCanceledAmount)}`;
            }

            canceledItemsList.innerHTML = canceledHtml;
            modal.classList.add('active');
        });

        const closeModal = () => {
            modal.classList.remove('active');
        };

        btnCloseModal.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Copy functionality using document.execCommand for better iframe compatibility
        btnCopyCanceled.addEventListener('click', () => {
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed'; // Prevent scrolling to bottom
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                const originalText = btnCopyCanceled.textContent;
                btnCopyCanceled.textContent = '已複製！';
                btnCopyCanceled.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                btnCopyCanceled.classList.add('bg-green-600', 'hover:bg-green-700');
                
                setTimeout(() => {
                    btnCopyCanceled.textContent = originalText;
                    btnCopyCanceled.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    btnCopyCanceled.classList.remove('bg-green-600', 'hover:bg-green-700');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            } finally {
                document.body.removeChild(textarea);
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            renderQuotation();
        });

    </script>
</body>
</html>
